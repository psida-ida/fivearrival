<!DOCTYPE html>
<html lang="zh-Hant">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>正式收據產生器</title>

<!-- ===== PWA:可加入主畫面、離線使用 ===== -->
<meta name="theme-color" content="#2563eb">
<meta name="description" content="離線可用的正式收據產生器,一鍵輸出 A5 橫向 PDF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="收據產生器">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="apple-touch-icon" href="icon-180.png">
<style>
  :root{
    --brand:#2563eb;
    --brand-dark:#1d4ed8;
    --line:#e5e7eb;
    --ink:#111827;
    --muted:#6b7280;
  }
  *{box-sizing:border-box;}
  body{
    margin:0;
    font-family:"Microsoft JhengHei","PingFang TC","Noto Sans TC",sans-serif;
    background:#f3f4f6;
    color:var(--ink);
  }
  header{
    background:var(--brand);
    color:#fff;
    padding:16px 24px;
    display:flex;
    align-items:center;
    justify-content:space-between;
    flex-wrap:wrap;
    gap:12px;
  }
  header h1{margin:0;font-size:20px;font-weight:700;}
  header .hint{font-size:13px;opacity:.85;}
  .wrap{
    display:flex;
    gap:24px;
    padding:24px;
    max-width:1320px;
    margin:0 auto;
    align-items:flex-start;
    flex-wrap:wrap;
  }
  .panel{
    background:#fff;
    border:1px solid var(--line);
    border-radius:12px;
    padding:20px;
    flex:1 1 400px;
    min-width:330px;
  }
  .panel h2{
    margin:0 0 16px;
    font-size:16px;
    border-left:4px solid var(--brand);
    padding-left:8px;
  }
  .grid{
    display:grid;
    grid-template-columns:repeat(2,1fr);
    gap:14px;
  }
  .field{display:flex;flex-direction:column;gap:6px;}
  .field.full{grid-column:1 / -1;}
  label{font-size:13px;color:var(--muted);}
  input,textarea,select{
    font-family:inherit;
    font-size:15px;
    padding:9px 10px;
    border:1px solid var(--line);
    border-radius:8px;
    background:#fff;
    width:100%;
  }
  input:focus,textarea:focus,select:focus{
    outline:none;
    border-color:var(--brand);
    box-shadow:0 0 0 3px rgba(37,99,235,.15);
  }
  textarea{resize:vertical;min-height:70px;}
  .section-title{
    grid-column:1 / -1;
    font-size:14px;
    font-weight:700;
    color:var(--brand-dark);
    margin-top:8px;
    padding-top:8px;
    border-top:1px dashed var(--line);
  }
  table.items{width:100%;border-collapse:collapse;}
  table.items th,table.items td{
    border-bottom:1px solid var(--line);
    padding:6px 4px;
    text-align:left;
    font-size:14px;
    vertical-align:top;
  }
  table.items th{color:var(--muted);font-weight:500;font-size:13px;}
  table.items input{padding:7px 8px;}
  /* 金額欄:加寬 + 右對齊,數字完整可見 */
  table.items td:nth-child(3) input{
    width:100%;
    min-width:110px;
    box-sizing:border-box;
    text-align:right;
    font-variant-numeric:tabular-nums;
    letter-spacing:.5px;
  }
  table.items th:nth-child(3){text-align:right;}
  .sub-input{display:flex;flex-direction:column;gap:6px;}
  .btn{
    font-family:inherit;
    font-size:15px;
    font-weight:600;
    border:none;
    border-radius:8px;
    padding:10px 16px;
    cursor:pointer;
    background:#e5e7eb;
    color:var(--ink);
  }
  .btn:hover{background:#d1d5db;}
  .btn.primary{background:var(--brand);color:#fff;}
  .btn.primary:hover{background:var(--brand-dark);}
  .btn-row{display:flex;gap:10px;flex-wrap:wrap;margin-top:16px;}
  .tiny{font-size:12px;color:var(--muted);}

  /* ===== 收據 ===== */
  .receipt-panel{flex:1 1 740px;min-width:540px;}
  .receipt{
    background:#fff;
    border:1px solid var(--line);
    border-radius:6px;
    padding:30px 36px;
    width:100%;
    max-width:840px;
    margin:0 auto;
    box-shadow:0 2px 10px rgba(0,0,0,.06);
    font-size:15px;
    line-height:1.6;
    color:#111827;
  }
  /* 抬頭 */
  .r-head{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    padding-bottom:14px;
    border-bottom:2px solid #1e3a8a;
  }
  .r-company{
    font-size:40px;
    font-weight:700;
    letter-spacing:2px;
    color:#1e3a8a;
    line-height:1.1;
  }
  .r-headright{text-align:right;font-size:14px;line-height:1.7;color:#374151;}
  .r-headright .r-no{font-weight:600;color:#111827;}

  /* TO */
  .r-to{margin-top:16px;font-size:15px;}
  .r-to b{margin-right:6px;color:#1e3a8a;}

  /* 標題 */
  .r-title{
    text-align:center;
    font-size:22px;
    font-weight:700;
    letter-spacing:6px;
    margin:14px 0 10px;
    padding-left:6px;
    color:#1e3a8a;
  }

  /* 明細表 */
  .r-table{width:100%;border-collapse:collapse;}
  .r-table th,.r-table td{
    padding:9px 6px;
    font-size:15px;
    text-align:left;
    vertical-align:top;
  }
  .r-table thead th{
    background:#eef2ff;
    border-top:2px solid #1e3a8a;
    border-bottom:1px solid #1e3a8a;
    font-weight:600;
    color:#1e3a8a;
  }
  .r-table tbody td{border-bottom:1px solid #e5e7eb;}
  .r-table .num{text-align:right;white-space:nowrap;width:130px;}
  .r-table .c{text-align:center;white-space:nowrap;width:130px;color:#374151;}
  .r-item-place{font-weight:600;}
  .r-item-desc{font-weight:400;color:#374151;}

  /* 合計區 */
  .r-summary{
    display:flex;
    justify-content:space-between;
    align-items:flex-start;
    gap:24px;
    margin-top:6px;
    padding-top:12px;
    border-top:2px solid #1e3a8a;
  }
  .r-summary .r-left{flex:1;min-width:0;}
  .r-pay{font-size:13px;color:#374151;line-height:1.7;}
  .r-total{text-align:right;flex:0 0 auto;}
  .r-total .cap{font-weight:600;color:#1e3a8a;font-size:14px;}
  .r-total .big{
    display:inline;
    margin-left:6px;
    font-size:30px;
    font-weight:700;
    letter-spacing:.5px;
    color:#111827;
  }
  .r-note{
    margin-top:10px;
    padding:8px 10px;
    background:#f8fafc;
    border-left:3px solid #1e3a8a;
    font-size:13px;
    color:#374151;
    white-space:pre-wrap;
  }
  /* 底部:左側頁尾,右側簽收 + 印章 */
  .r-bottom{
    display:flex;
    justify-content:space-between;
    align-items:flex-end;
    gap:24px;
    margin-top:26px;
  }
  .r-foot{flex:1;font-size:12px;color:var(--muted);}
  .r-sign{
    position:relative;
    flex:0 0 auto;
    width:210px;
    height:104px;
  }
  .r-sign .box{
    position:absolute;
    left:0;
    bottom:0;
    width:100%;
    z-index:1;
  }
  .r-sign .line{border-bottom:1px solid #111827;height:36px;}
  .r-stamp{
    position:absolute;
    right:8px;
    bottom:0;
    width:96px;
    height:96px;
    opacity:.9;
    transform:rotate(-6deg);
    z-index:0;
    pointer-events:none;
  }
  .r-stamp svg{width:100%;height:100%;display:block;}

  /* ===== 手機 / 平板 ===== */
  .rviewport{width:100%;overflow:hidden;}

  @media screen and (max-width:900px){
    .receipt{width:840px;max-width:840px;transform-origin:top left;}
    .wrap{flex-direction:column;padding:12px;gap:14px;align-items:stretch;}
    .panel{min-width:0;width:100%;padding:16px;}
    .receipt-panel{min-width:0;width:100%;}
    .grid{grid-template-columns:1fr;}
    header{padding:14px 16px;}
    header h1{font-size:18px;}
    .rviewport{border:1px solid var(--line);border-radius:8px;background:#fff;}

    /* 項目明細改為卡片式堆疊,每欄帶標籤 */
    table.items,table.items tbody,table.items tr,table.items td{display:block;width:100%;}
    table.items thead{display:none;}
    table.items tr{
      border:1px solid var(--line);
      border-radius:8px;
      padding:8px 10px;
      margin-bottom:10px;
      background:#fafafa;
    }
    table.items th,table.items td{border:none;padding:4px 0;}
    table.items td::before{
      content:attr(data-label);
      display:block;
      font-size:12px;
      color:var(--muted);
      margin-bottom:3px;
    }
    table.items td:nth-child(3) input{text-align:left;min-width:0;}

    /* 按鈕加大、方便手指點按 */
    .btn{padding:13px 16px;font-size:15px;}
    .btn-row .btn{flex:1 1 auto;}
    .btn-row{gap:8px;}
    textarea{min-height:88px;}
  }

  @media screen and (max-width:420px){
    header .hint{display:none;}
    .btn-row{flex-direction:column;}
    .btn-row .btn{width:100%;}
  }

  @media print{
    body{background:#fff;}
    header,.form-panel,.btn-row,.no-print{display:none !important;}
    .wrap{padding:0;gap:0;display:block;}
    .panel.receipt-panel{border:none;padding:0;box-shadow:none;flex:none;}
    /* 手機縮放在列印時必須解除,否則會印出縮小版 */
    .rviewport{overflow:visible !important;height:auto !important;border:none !important;background:none !important;}
    .receipt{transform:none !important;border:none;box-shadow:none;max-width:none;padding:0;font-size:9pt;page-break-inside:avoid;break-inside:avoid;display:flex;flex-direction:column;min-height:465px;}
    @page{size:210mm 148mm;margin:8mm;}
    /* 橫向 A5 專用尺寸 */
    .r-company{font-size:24px;letter-spacing:1px;}
    .r-head{padding-bottom:8px;}
    .r-headright{font-size:8.5pt;line-height:1.5;}
    .r-to{margin-top:8px;font-size:9pt;}
    .r-title{font-size:14px;letter-spacing:5px;margin:8px 0 6px;padding-left:5px;}
    .r-table th,.r-table td{padding:5px 4px;font-size:9pt;}
    .r-summary{margin-top:4px;padding-top:8px;}
    .r-pay{font-size:8pt;}
    .r-total .cap{font-size:10pt;}
    .r-total .big{font-size:20px;margin-left:5px;}
    .r-note{margin-top:6px;padding:5px 8px;font-size:8pt;}
    .r-bottom{margin-top:auto;padding-top:14px;}
    .r-sign{width:180px;height:86px;}
    .r-stamp{width:78px;height:78px;right:6px;}
    .r-sign .line{height:26px;}
    .r-foot{font-size:7.5pt;}
  }
</style>
</head>
<body>

<header>
  <h1>正式收據產生器</h1>
  <span class="hint">填寫左側資料 · 右側即時預覽 · 完成後按「直接存成 PDF」下載</span>
</header>

<div class="wrap">

  <!-- ============ 表單 ============ -->
  <section class="panel form-panel">
    <h2>收據資料</h2>
    <div class="grid">

      <div class="field full">
        <label for="company">公司 / 商號名稱</label>
        <input id="company" type="text" value="快達服務">
      </div>

      <div class="field">
        <label for="number">編號</label>
        <input id="number" type="text" value="2611_08">
      </div>
      <div class="field">
        <label for="date">收據日期</label>
        <input id="date" type="date">
      </div>

      <div class="field full">
        <label for="buyer">TO — 客戶名稱</label>
        <input id="buyer" type="text" value="JP Partners Medical Centre Limited">
      </div>

      <div class="field">
        <label for="title">收據標題</label>
        <input id="title" type="text" value="正式收據">
      </div>
      <div class="field">
        <label for="currency">幣別</label>
        <select id="currency">
          <option value="HK$" selected>HK$ 港幣</option>
          <option value="NT$">NT$ 新台幣</option>
          <option value="RMB¥">RMB¥ 人民幣</option>
          <option value="US$">US$ 美元</option>
        </select>
      </div>

      <div class="section-title">項目明細</div>
      <div class="field full">
        <table class="items">
          <thead>
            <tr>
              <th style="width:56%">地點 / 工作內容</th>
              <th style="width:16%">工作日期</th>
              <th style="width:28%">金額</th>
            </tr>
          </thead>
          <tbody id="itemBody"></tbody>
        </table>
        <div class="btn-row">
          <button class="btn" id="addItem" type="button">＋ 新增項目</button>
          <button class="btn" id="delItem" type="button">－ 刪除最後一列</button>
        </div>
      </div>

      <div class="field">
        <label for="paidDate">付款 / 收款日期(留空則不顯示)</label>
        <input id="paidDate" type="date">
      </div>
      <div class="field">
        <label for="payMethod">付款方式(留空則不顯示)</label>
        <select id="payMethod">
          <option value="">(不顯示)</option>
          <option>現金</option>
          <option>現金轉賬</option>
          <option>支票</option>
          <option>銀行轉帳</option>
          <option>信用卡</option>
          <option>支付寶 / 微信支付</option>
        </select>
      </div>

      <div class="field full">
        <label for="note">備註(留空則不顯示)</label>
        <textarea id="note" placeholder="例:多謝惠顧!"></textarea>
      </div>

      <div class="field full">
        <label>
          <input type="checkbox" id="showSign" checked style="width:auto;margin-right:6px;">
          顯示簽收欄
        </label>
      </div>

    </div>

    <div class="btn-row no-print">
      <button class="btn primary" id="doPdf" type="button">💾 直接存成 PDF</button>
      <button class="btn" id="doPrint" type="button">🖨️ 列印</button>
      <button class="btn" id="resetBtn" type="button">重設範例</button>
    </div>
    <p class="tiny no-print">小提示:按「直接存成 PDF」會下載 A5 橫向 PDF;「列印」可用於列印紙本。</p>
  </section>

  <!-- ============ 預覽 ============ -->
  <section class="panel receipt-panel">
    <h2 class="no-print">收據預覽</h2>
    <div class="rviewport" id="rviewport">
    <div class="receipt" id="receipt">

      <div class="r-head">
        <div class="r-company" id="pvCompany"></div>
        <div class="r-headright">
          <div class="r-no">編號：<span id="pvNumber"></span></div>
          <div id="pvDate"></div>
        </div>
      </div>

      <div class="r-to"><b>TO :</b><span id="pvBuyer"></span></div>

      <div class="r-title" id="pvTitle"></div>

      <table class="r-table">
        <thead>
          <tr>
            <th>項目</th>
            <th class="c">工作日期</th>
            <th class="num">金額</th>
          </tr>
        </thead>
        <tbody id="pvItems"></tbody>
      </table>

      <div class="r-summary">
        <div class="r-left">
          <div class="r-pay" id="pvPaidInfo"></div>
          <div class="r-note" id="pvNote"></div>
        </div>
        <div class="r-total">
          <span class="cap">總數：</span>
          <span class="big" id="pvTotal"></span>
        </div>
      </div>

      <div class="r-bottom">
        <div class="r-foot" id="pvFoot"></div>
        <div class="r-sign" id="pvSignWrap">
          <div class="r-stamp" id="pvStamp">
            <svg viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
              <!-- 菱形底 -->
              <polygon points="100,6 194,100 100,194 6,100" fill="#ffffff" stroke="#c9273f" stroke-width="3"/>
              <!-- 外圈 -->
              <circle cx="100" cy="100" r="64" fill="none" stroke="#c9273f" stroke-width="4"/>
              <!-- 內圈實心 -->
              <circle cx="100" cy="100" r="56" fill="#c9273f"/>
              <!-- 斜向字 -->
              <text x="100" y="100" fill="#ffffff" font-size="34" font-weight="700"
                    text-anchor="middle" dominant-baseline="central"
                    transform="rotate(-45 100 100)"
                    font-family="'Microsoft JhengHei','PingFang TC','Noto Sans TC',sans-serif">快達服務</text>
            </svg>
          </div>
          <div class="box">
            <div class="line"></div>
          </div>
        </div>
      </div>
    </div>
    </div>
  </section>

</div>

<script src="lib/jspdf.umd.min.js"></script>
<script src="lib/html2canvas.min.js"></script>
<script>
(function(){
  "use strict";

  var $ = function(id){ return document.getElementById(id); };

  // ---------- 日期工具 ----------
  function todayISO(){
    var d = new Date();
    var mm = String(d.getMonth()+1).padStart(2,"0");
    var dd = String(d.getDate()).padStart(2,"0");
    return d.getFullYear() + "-" + mm + "-" + dd;
  }
  // 2026-11-01 -> 2026 年 11 月 1 日
  function fmtCN(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length !== 3) return iso;
    return Number(p[0]) + " 年 " + Number(p[1]) + " 月 " + Number(p[2]) + " 日";
  }
  // 2026-10-24 -> 24.10.2026
  function fmtDot(iso){
    if(!iso) return "";
    var p = iso.split("-");
    if(p.length !== 3) return iso;
    return p[2] + "." + p[1] + "." + p[0];
  }

  // ---------- 金額格式化 ----------
  function fmtMoney(v, unit){
    var n = Number(v) || 0;
    return unit + n.toLocaleString("en-US", {minimumFractionDigits:0, maximumFractionDigits:2});
  }

  // ---------- 項目資料 ----------
  // 每筆:place(地點)、desc(工作內容)、workDate(工作日期)、amount(金額)
  var rows = [
    {place:"莊柏醫療 (黃金海岸店)", desc:"更換 LED 燈帶及火牛", workDate:"2026-10-24", amount:570}
  ];

  function buildRows(){
    var body = $("itemBody");
    body.innerHTML = "";
    rows.forEach(function(r, i){
      var tr = document.createElement("tr");

      // 地點 + 工作內容
      var td1 = document.createElement("td");
      td1.setAttribute("data-label", "地點 / 工作內容");
      var box = document.createElement("div");
      box.className = "sub-input";

      var inPlace = document.createElement("input");
      inPlace.type = "text";
      inPlace.placeholder = "地點 / 客戶分店";
      inPlace.value = r.place;
      inPlace.addEventListener("input", function(){ rows[i].place = inPlace.value; render(); });

      var inDesc = document.createElement("input");
      inDesc.type = "text";
      inDesc.placeholder = "工作內容";
      inDesc.value = r.desc;
      inDesc.addEventListener("input", function(){ rows[i].desc = inDesc.value; render(); });

      box.appendChild(inPlace);
      box.appendChild(inDesc);
      td1.appendChild(box);

      // 工作日期
      var td2 = document.createElement("td");
      td2.setAttribute("data-label", "工作日期");
      var inWd = document.createElement("input");
      inWd.type = "date";
      inWd.value = r.workDate;
      inWd.addEventListener("input", function(){ rows[i].workDate = inWd.value; render(); });
      td2.appendChild(inWd);

      // 金額(純文字手打,不設限)
      var td3 = document.createElement("td");
      td3.setAttribute("data-label", "金額");
      var inAmt = document.createElement("input");
      inAmt.type = "text";
      inAmt.inputMode = "decimal";
      inAmt.placeholder = "570";
      inAmt.value = r.amount || "";
      inAmt.addEventListener("input", function(){
        var clean = inAmt.value.replace(/,/g, "");
        rows[i].amount = Number(clean) || 0;
        render();
      });
      td3.appendChild(inAmt);

      tr.appendChild(td1); tr.appendChild(td2); tr.appendChild(td3);
      body.appendChild(tr);
    });
    render();
  }

  $("addItem").addEventListener("click", function(){
    rows.push({place:"", desc:"", workDate:"", amount:0});
    buildRows();
  });
  $("delItem").addEventListener("click", function(){
    if(rows.length > 1){ rows.pop(); buildRows(); }
  });

  // ---------- 渲染 ----------
  function render(){
    var company  = $("company").value.trim();
    var number   = $("number").value.trim();
    var date     = $("date").value;
    var buyer    = $("buyer").value.trim();
    var title    = $("title").value.trim();
    var currency = $("currency").value;
    var paidDate = $("paidDate").value;
    var payMethod= $("payMethod").value;
    var note     = $("note").value;
    var showSign = $("showSign").checked;

    $("pvCompany").textContent = company || "—";
    $("pvNumber").textContent  = number || "—";
    $("pvDate").textContent    = fmtCN(date);
    $("pvBuyer").textContent   = buyer || "";
    $("pvTitle").textContent   = title || "收據";

    // 明細
    var tbody = $("pvItems");
    tbody.innerHTML = "";
    var total = 0;

    rows.forEach(function(r){
      total += Number(r.amount) || 0;

      var tr = document.createElement("tr");

      var td1 = document.createElement("td");
      if(r.place){
        var p = document.createElement("div");
        p.className = "r-item-place";
        p.textContent = r.place;
        td1.appendChild(p);
      }
      if(r.desc){
        var d = document.createElement("div");
        d.className = "r-item-desc";
        d.textContent = r.desc;
        td1.appendChild(d);
      }
      if(!r.place && !r.desc){
        td1.textContent = "（未填寫項目）";
      }

      var tdD = document.createElement("td");
      tdD.className = "c";
      tdD.textContent = r.workDate ? fmtDot(r.workDate) : "";

      var td2 = document.createElement("td");
      td2.className = "num";
      td2.textContent = fmtMoney(r.amount, currency);

      tr.appendChild(td1); tr.appendChild(tdD); tr.appendChild(td2);
      tbody.appendChild(tr);
    });

    // 付款資訊
    var pi = [];
    if(payMethod) pi.push("付款方式 : " + payMethod);
    if(paidDate)  pi.push("收款日期 : " + fmtDot(paidDate));
    var piEl = $("pvPaidInfo");
    if(pi.length){
      piEl.innerHTML = "";
      pi.forEach(function(t){
        var div = document.createElement("div");
        div.textContent = t;
        piEl.appendChild(div);
      });
      piEl.style.display = "";
    }else{
      piEl.style.display = "none";
    }

    $("pvTotal").textContent = fmtMoney(total, currency);

    var nEl = $("pvNote");
    if(note.trim()){ nEl.textContent = note; nEl.style.display = ""; }
    else{ nEl.style.display = "none"; }

    $("pvSignWrap").style.display = showSign ? "" : "none";

    $("pvFoot").textContent = (company && number) ? (company + "　·　編號 " + number) : (company || number || "");

    fitReceipt();
  }

  // 綁定一般欄位
  ["company","number","date","buyer","title","currency","paidDate","payMethod","note","showSign"]
    .forEach(function(id){
      $(id).addEventListener("input", render);
      $(id).addEventListener("change", render);
    });

  $("doPrint").addEventListener("click", function(){ window.print(); });

  // ---------- 直接存成 PDF(A5 橫向,不經列印對話框) ----------
  function savePDF(){
    var JsPDFCtor = (window.jspdf && window.jspdf.jsPDF) || window.jsPDF;
    if(typeof window.html2canvas !== "function" || !JsPDFCtor){
      alert("PDF 函式庫尚未載入,請確認 lib 資料夾是否完整。");
      return;
    }
    var el = $("receipt");
    var vp = $("rviewport");
    var number = ($("number").value || "").trim();
    var oldShadow = el.style.boxShadow;
    var oldTransform = el.style.transform;
    var oldVpH = vp ? vp.style.height : "";
    var oldVpOverflow = vp ? vp.style.overflow : "";
    el.style.boxShadow = "none";   // 邊緣陰影不進 PDF
    el.style.transform = "none";   // 以原始 840px 寬擷取,與螢幕縮放無關
    if(vp){ vp.style.height = "auto"; vp.style.overflow = "visible"; }

    function restore(){
      el.style.boxShadow = oldShadow;
      el.style.transform = oldTransform;
      if(vp){ vp.style.height = oldVpH; vp.style.overflow = oldVpOverflow; }
    }

    window.html2canvas(el, {scale:2, backgroundColor:"#ffffff", useCORS:true})
      .then(function(canvas){
        restore();

        var pdf = new JsPDFCtor({orientation:"landscape", unit:"mm", format:"a5"});
        var pageW = 210, pageH = 148, margin = 10;
        var availW = pageW - margin * 2;
        var availH = pageH - margin * 2;
        var ratio = Math.min(availW / canvas.width, availH / canvas.height);
        var w = canvas.width * ratio;
        var h = canvas.height * ratio;
        var x = (pageW - w) / 2;
        var y = margin;

        pdf.addImage(canvas.toDataURL("image/jpeg", 0.94), "JPEG", x, y, w, h, undefined, "FAST");
        pdf.save("收據_" + (number || "receipt") + ".pdf");
      })
      .catch(function(err){
        restore();
        alert("產生 PDF 失敗:" + err);
      });
  }
  $("doPdf").addEventListener("click", savePDF);

  $("resetBtn").addEventListener("click", function(){
    $("company").value   = "快達服務";
    $("number").value    = "2611_08";
    $("buyer").value     = "JP Partners Medical Centre Limited";
    $("title").value     = "正式收據";
    $("currency").value  = "HK$";
    $("paidDate").value  = "";
    $("payMethod").value = "";
    $("note").value      = "";
    $("showSign").checked = true;
    $("date").value = todayISO();
    rows = [
      {place:"莊柏醫療 (黃金海岸店)", desc:"更換 LED 燈帶及火牛", workDate:"2026-10-24", amount:570}
    ];
    buildRows();
  });

  // ---------- 螢幕縮放:窄螢幕時把收據等比縮小以完整顯示 ----------
  function fitReceipt(){
    var vp = $("rviewport"), el = $("receipt");
    if(!vp || !el) return;
    var avail = vp.clientWidth;
    var natural = el.offsetWidth;   // 版面寬(不受 transform 影響)
    if(!avail || !natural){ el.style.transform = ""; vp.style.height = ""; return; }
    var scale = avail < natural ? avail / natural : 1;
    if(scale < 1){
      el.style.transform = "scale(" + scale + ")";
      // 容器高度 = 收據實際高度 × 縮放比,避免留下空白
      vp.style.height = Math.round(el.offsetHeight * scale) + "px";
    }else{
      el.style.transform = "";
      vp.style.height = "";
    }
  }
  window.addEventListener("resize", fitReceipt);

  // 初始化
  $("date").value = todayISO();
  buildRows();
  fitReceipt();
})();

// ---------- 註冊 Service Worker(離線快取 + 可加入主畫面) ----------
// 注意:Service Worker 只能在 http/https 下運作,直接用 file:// 開啟時會自動略過
if("serviceWorker" in navigator && location.protocol.indexOf("http") === 0){
  window.addEventListener("load", function(){
    navigator.serviceWorker.register("sw.js").catch(function(err){
      console.warn("Service Worker 註冊失敗(不影響功能):", err);
    });
  });
}
</script>
